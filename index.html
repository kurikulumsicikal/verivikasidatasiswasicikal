<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kesesuaian Data Siswa</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 950px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #1a202c;
            margin-top: 0;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .loading {
            text-align: center;
            color: #718096;
            display: none;
            margin: 20px 0;
            font-weight: 600;
        }
        .error-box {
            background-color: #fff5f5;
            color: #e53e3e;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        .result-card {
            display: none;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .result-header {
            background-color: #ebf8ff;
            color: #2b6cb0;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #bee3f8;
        }
        .table-data {
            width: 100%;
            border-collapse: collapse;
        }
        .table-data th, .table-data td {
            padding: 10px 14px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
            text-align: left;
            vertical-align: middle;
        }
        .table-data tr:nth-child(even) {
            background-color: #f7fafc;
        }
        .table-data td.label {
            font-weight: 600;
            color: #4a5568;
            width: 25%;
        }
        .table-data td.value {
            color: #2d3748;
            width: 35%;
        }
        .table-data td.action {
            width: 40%;
        }
        .btn-sesuai {
            background-color: #38a169;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-right: 4px;
        }
        .btn-sesuai:hover { background-color: #2f855a; }
        .btn-koreksi {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-koreksi:hover { background-color: #c53030; }
        .edit-container {
            display: none;
            margin-top: 8px;
        }
        .edit-input {
            width: 100%;
            padding: 6px;
            font-size: 13px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .btn-kirim {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .instruction {
            background-color: #fffaf0;
            border: 1px solid #feebc8;
            color: #c05621;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
        }
        .badge-sesuai { background-color: #c6f6d5; color: #22543d; }
        .badge-koreksi { background-color: #fed7d7; color: #c53030; }
    </style>
</head>
<body>

<div class="container">
    <h2>VERIVIKASI KESESUAIAN DATA SISWA</h2>
    <p class="subtitle">Periksa data Anda, klik <strong>Sesuai</strong> jika sudah benar atau pilih <strong>Koreksi</strong> jika ada yang salah</p>
    
    <div class="search-box">
        <input type="text" id="nisnInput" placeholder="Masukkan NISN Siswa...">
        <button onclick="verifikasiSiswa()">Cek Data</button>
    </div>

    <div id="loading" class="loading">Memeriksa database...</div>
    <div id="errorBox" class="error-box"></div>

    <div id="resultCard" class="result-card">
        <div class="result-header">Tabel Kesesuaian Data</div>
        <div class="instruction" id="instructionBox">
            Silakan periksa setiap baris data. Status atau koreksi yang sudah pernah dikirim akan otomatis terlihat di sini.
        </div>
        <table class="table-data" id="dataTable"></table>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwKVnTxE7WrRNw_IoId4VmIepYNLEBbXWIypGgNJ7ohWNSoKOb1z6nqZRUIUMT4zL5mJw/exec";
    let currentSiswaNama = "";
    let currentSiswaNisn = "";

    function verifikasiSiswa() {
        const nisn = document.getElementById('nisnInput').value.trim();
        const loadingDiv = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const resultCard = document.getElementById('resultCard');

        if (!nisn) {
            alert('Harap masukkan NISN terlebih dahulu!');
            return;
        }

        resultCard.style.display = 'none';
        errorBox.style.display = 'none';
        loadingDiv.style.display = 'block';

        fetch(`${API_URL}?nisn=${encodeURIComponent(nisn)}`)
            .then(response => response.json())
            .then(data => {
                loadingDiv.style.display = 'none';

                if (data.found) {
                    currentSiswaNama = data.nama || '-';
                    currentSiswaNisn = data.nisn || '-';

                    let tglLahirFormatted = data.tanggalLahir ? new Date(data.tanggalLahir).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';

                    let rows = [
                        { label: "Nama Lengkap", val: currentSiswaNama },
                        { label: "Jenis Kelamin", val: data.jk === 'L' ? 'Laki-Laki' : (data.jk === 'P' ? 'Perempuan' : data.jk || '-') },
                        { label: "NIPD", val: data.nipd || '-' },
                        { label: "NISN", val: currentSiswaNisn },
                        { label: "Tempat Lahir", val: data.tempatLahir || '-' },
                        { label: "Tanggal Lahir", val: tglLahirFormatted },
                        { label: "NIK", val: data.nik || '-' },
                        { label: "Agama", val: data.agama || '-' },
                        { label: "Alamat", val: data.alamat || '-' },
                        { label: "RT", val: data.rt !== undefined && data.rt !== "" ? data.rt : '-' },
                        { label: "RW", val: data.rw !== undefined && data.rw !== "" ? data.rw : '-' },
                        { label: "Kelurahan", val: data.kelurahan || '-' },
                        { label: "Kecamatan", val: data.kecamatan || '-' },
                        { label: "Kode Pos", val: data.kodePos || '-' },
                        { label: "Nama Ayah", val: data.namaAyah || '-' },
                        { label: "Pekerjaan Ayah", val: data.pekerjaanAyah || '-' },
                        { label: "Nama Ibu", val: data.namaIbu || '-' },
                        { label: "Pekerjaan Ibu", val: data.pekerjaanIbu || '-' },
                        { label: "Rombel Saat Ini", val: data.rombel || '-' },
                        { label: "Sekolah Asal", val: data.sekolahAsal || '-' },
                        { label: "Anak ke-", val: data.anakKe ? `Anak ke-${data.anakKe}` : '-' }
                    ];

                    let tableHtml = `<tr><th>Data Field</th><th>Data di Server</th><th>Status / Hasil Koreksi & Aksi</th></tr>`;
                    
                    rows.forEach((row, index) => {
                        // Ambil riwayat status/koreksi yang tersimpan di server jika ada
                        let savedVal = data.statusKesesuaian ? data.statusKesesuaian[row.label] : "";
                        let badgeHtml = "";
                        let defaultInputVal = "";

                        if (savedVal === "Sesuai") {
                            badgeHtml = `<br><span class="status-badge badge-sesuai">✓ Sesuai</span>`;
                        } else if (savedVal && savedVal !== "") {
                            // Jika ada isinya dan bukan "Sesuai", berarti itu teks koreksi dari siswa
                            badgeHtml = `<br><span class="status-badge badge-koreksi">✎ Koreksi: <strong>${savedVal}</strong></span>`;
                            defaultInputVal = savedVal;
                        }

                        tableHtml += `
                            <tr>
                                <td class="label">${row.label}</td>
                                <td class="value">${row.val} <div id="badgeContainer_${index}">${badgeHtml}</div></td>
                                <td class="action">
                                    <div id="actionContainer_${index}">
                                        <button class="btn-sesuai" onclick="kirimData('${row.label}', 'Sesuai', ${index})">Sesuai</button>
                                        <button class="btn-koreksi" onclick="bukaFormKoreksi(${index})">Koreksi</button>
                                    </div>
                                    <div class="edit-container" id="editContainer_${index}">
                                        <input type="text" id="editInput_${index}" class="edit-input" value="${defaultInputVal}" placeholder="Ketik data yang benar...">
                                        <button class="btn-kirim" onclick="kirimKoreksiData('${row.label}', ${index})">Kirim Perbaikan</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });

                    document.getElementById('dataTable').innerHTML = tableHtml;
                    document.getElementById('instructionBox').style.display = 'block';
                    resultCard.style.display = 'block';
                } else {
                    errorBox.innerHTML = 'Data siswa dengan NISN <strong>' + nisn + '</strong> tidak ditemukan.';
                    errorBox.style.display = 'block';
                }
            })
            .catch(error => {
                loadingDiv.style.display = 'none';
                errorBox.innerHTML = 'Gagal menghubungkan ke server.';
                errorBox.style.display = 'block';
                console.error(error);
            });
    }

    function bukaFormKoreksi(index) {
        let container = document.getElementById(`editContainer_${index}`);
        container.style.display = container.style.display === 'block' ? 'none' : 'block';
    }

    function kirimData(fieldLabel, teksKirim, index) {
        let payload = {
            nisn: currentSiswaNisn,
            nama: currentSiswaNama,
            field: fieldLabel,
            koreksi: teksKirim
        };

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            let badgeContainer = document.getElementById(`badgeContainer_${index}`);
            if(teksKirim === 'Sesuai') {
                badgeContainer.innerHTML = `<span class="status-badge badge-sesuai">✓ Sesuai</span>`;
                document.getElementById(`editContainer_${index}`).style.display = 'none';
                alert(`"${fieldLabel}" berhasil dicatat sebagai Sesuai.`);
            } else {
                badgeContainer.innerHTML = `<span class="status-badge badge-koreksi">✎ Koreksi: <strong>${teksKirim}</strong></span>`;
                alert(`Koreksi untuk "${fieldLabel}" berhasil dikirim!`);
                bukaFormKoreksi(index);
            }
        })
        .catch(err => {
            alert('Gagal mengirim data. Coba lagi.');
            console.error(err);
        });
    }

    function kirimKoreksiData(fieldLabel, index) {
        let inputVal = document.getElementById(`editInput_${index}`).value.trim();
        if (!inputVal) {
            alert('Harap ketik data yang benar terlebih dahulu!');
            return;
        }
        
        kirimData(fieldLabel, inputVal, index);
    }
</script>

</body>
</html>
